<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul Interaktif Pemrograman Dasar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold cursor-pointer" onclick="showHome()">💻 BelajarCoding: Pemrograman Dasar</h1>
            <nav class="space-x-4">
                <button onclick="showHome()" class="hover:text-indigo-200">Materi</button>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 flex-grow max-w-4xl">
        <!-- Beranda -->
        <div id="home-view">
            <h2 class="text-3xl font-extrabold mb-4 text-slate-900">Modul Pembelajaran Pemrograman Dasar</h2>
            <p class="text-slate-600 mb-6">Pilih Bab di bawah ini untuk mulai belajar dan mengerjakan kuis:</p>
            <div class="grid md:grid-cols-2 gap-4">
                <div onclick="selectChapter('bab1')" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 cursor-pointer hover:bg-indigo-50 transition">
                    <h3 class="font-bold text-lg text-indigo-600">BAB 1: Logika & Algoritma</h3>
                    <p class="text-sm text-slate-600 mt-1">Pelajari dasar pemikiran dan struktur algoritma.</p>
                </div>
            </div>
        </div>

        <!-- Ruang Belajar -->
        <div id="learning-view" class="hidden">
            <button onclick="showHome()" class="mb-4 text-indigo-600 font-semibold hover:underline">&larr; Kembali</button>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div id="chapter-header" class="mb-4 border-b pb-3 font-bold text-xl text-slate-900"></div>
                <div id="content-materi" class="mb-6 text-slate-700"></div>
                <div id="quiz-container"></div>
                <div id="quiz-result" class="hidden text-center p-6 bg-slate-100 rounded-xl"></div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-sm text-slate-500">
        <p>&copy; 2026 BelajarCoding</p>
    </footer>

    <script>
        // 🛑 PASTE URL GOOGLE APPS SCRIPT ANDA DI DALAM TANDA KUTIP DI BAWAH INI
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw7TXCjtsY9iCg6JC0cZ2YLCtYa_6F8dTuAwZ_dpWuHSjuz1b424WDjNH9KZw9QAkbQKg/exec";

        const courseData = {
            "bab1": {
                title: "BAB 1: Logika & Algoritma",
                materi: "<p class='mb-3'>Algoritma adalah urutan langkah logis untuk menyelesaikan masalah. Setiap langkah harus jelas dan pasti.</p>",
                quiz: [
                    {
                        question: "Apa definisi utama dari sebuah algoritma?",
                        options: [
                            "Urutan langkah logis penyelesaian masalah",
                            "Bahasa pemrograman komputer",
                            "Hardware komputer",
                            "Aplikasi Android"
                        ],
                        answer: 0
                    }
                ]
            }
        };

        let currentActiveChapter = "bab1";

        function showHome() {
            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('learning-view').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectChapter(key) {
            currentActiveChapter = key;
            const data = courseData[key];
            document.getElementById('chapter-headerinnerText' || 'chapter-header').innerText = data.title;
            document.getElementById('content-materi').innerHTML = data.materi;
            renderQuiz(data.quiz);
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('learning-view').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderQuiz(quizArray) {
            const container = document.getElementById('quiz-container');
            const resultContainer = document.getElementById('quiz-result');
            resultContainer.classList.add('hidden');
            container.classList.remove('hidden');

            let html = `
                <div class="mb-6 p-4 bg-indigo-50 rounded-xl border border-indigo-100">
                    <label class="block font-semibold text-sm mb-1 text-slate-900">Nama Lengkap Siswa:</label>
                    <input type="text" id="nama-siswa" placeholder="Ketik nama lengkap Anda..." class="w-full p-3 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            `;

            quizArray.forEach((q, qIndex) => {
                html += `<div class="mb-4 p-4 bg-slate-50 rounded-xl border border-slate-200"><p class="font-semibold mb-3 text-slate-900">${qIndex + 1}. ${q.question}</p><div class="space-y-2">`;
                q.options.forEach((opt, optIndex) => {
                    html += `
                        <label class="flex items-center space-x-3 p-3 bg-white rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50 transition">
                            <input type="radio" name="q-${qIndex}" value="${optIndex}" class="text-indigo-600">
                            <span class="text-slate-700 text-sm">${opt}</span>
                        </label>
                    `;
                });
                html += `</div></div>`;
            });

            html += `<button id="btn-submit" onclick="submitQuiz()" class="w-full bg-indigo-600 text-white p-3 rounded-xl font-semibold hover:bg-indigo-700 transition shadow-md">Kirim Nilai</button>`;
            container.innerHTML = html;
        }

        async function submitQuiz() {
            const namaInput = document.getElementById('nama-siswa');
            if (!namaInput || !namaInput.value.trim()) {
                alert("Mohon masukkan Nama Lengkap Anda terlebih dahulu!");
                if(namaInput) namaInput.focus();
                return;
            }

            const quizArray = courseData[currentActiveChapter].quiz;
            let score = 0;
            let allAnswered = true;

            quizArray.forEach((q, qIndex) => {
                const selected = document.querySelector(`input[name="q-${qIndex}"]:checked`);
                if (selected) {
                    if (parseInt(selected.value) === q.answer) score++;
                } else {
                    allAnswered = false;
                }
            });

            if (!allAnswered) {
                alert("Harap jawab semua pertanyaan terlebih dahulu!");
                return;
            }

            const submitBtn = document.getElementById('btn-submit');
            submitBtn.innerText = "Mengirim Nilai...";
            submitBtn.disabled = true;

            // Kirim ke Google Sheets
            if (GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes("GANTI_DENGAN_URL")) {
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            nama: namaInput.value,
                            bab: courseData[currentActiveChapter].title,
                            skor: score,
                            total: quizArray.length
                        })
                    });
                } catch (e) {
                    console.error("Gagal kirim:", e);
                }
            }

            document.getElementById('quiz-container').classList.add('hidden');
            const res = document.getElementById('quiz-result');
            res.classList.remove('hidden');
            res.innerHTML = `
                <h3 class="font-bold text-2xl text-green-600 mb-2">Berhasil Dikirim!</h3>
                <p class="text-slate-600 mb-4">Terima kasih, <strong>${namaInput.value}</strong>. Skor Anda: <strong>${score} / ${quizArray.length}</strong></p>
                <button onclick="renderQuiz(courseData['${currentActiveChapter}'].quiz)" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">Ulangi Kuis</button>
            `;
        }
    </script>
</body>
</html>
